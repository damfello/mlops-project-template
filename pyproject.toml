[project]
name = "mlops-project-template"
version = "0.1.0"
description = "My MLOps template following a modular deployment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core Data Science & Math
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    
    # Visualization & EDA
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    
    # Jupyter & Interactive Notebooks
    "ipykernel>=6.29.0",
    
    # Data Engineering & Utilities
    "duckdb>=0.10.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "loguru>=0.7.0",
    "tqdm>=4.66.0",
    
    # MLOps & Experiment Tracking (Blueprint Component)
    "mlflow>=2.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
